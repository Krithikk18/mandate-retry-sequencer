[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-retry-sequencer"
version = "0.1.0"
description = "Synthetic data generator + ground-truth oracle for Indian subscription payment failures"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # Upper bound is deliberate. pandas 3.0 infers a list of [None, "x", None]
    # as StringDtype whose NA sentinel is nan rather than None, so the
    # None-coercion in generate.load_dataset was undone by to_dict("records")
    # and three round-trip tests failed on a fresh install. load_dataset now
    # forces object dtype and is version-agnostic, but the bound stays until
    # the whole suite has actually been run against a pandas 3 release: a
    # reviewer's first two commands are pip install and pytest, and they must
    # not see red because of a major version nobody here has tested on.
    "pandas>=2.1,<3",
    "pydantic>=2.6",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# `slow` is deselected by default so the ordinary run stays fast. The only
# thing marked slow is tests/test_docs.py, which re-runs every experiment at
# 20 seeds to check that the numbers written in README.md and CONTEXT.md still
# reproduce - a release gate rather than an inner-loop test.
#   pytest              the 267 fast tests
#   pytest -m slow      the documented-numbers check (~10 min)
#   pytest -m ""        everything
addopts = "-q -m 'not slow'"
markers = [
    "slow: re-runs the full experiment suite; deselected unless asked for",
]
